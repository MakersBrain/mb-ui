name: Publish

# Publishing is triggered by a tag, not by a push to main, so that releasing is
# a deliberate act with a name rather than a side effect of merging. The tag
# must match the version in package.json -- the job refuses to publish if it
# does not, which is what stops `v0.2.0` shipping a tarball that says 0.1.9.
#
# Target registry is GitHub Packages, which is where the org's other artifacts
# already live and which authenticates with the workflow's own GITHUB_TOKEN --
# no long-lived npm credential has to exist. To publish to npmjs.com instead,
# change `registry-url` here and `publishConfig.registry` in package.json, and
# supply an NPM_TOKEN secret in place of the GITHUB_TOKEN below.

on:
  push:
    tags: ['ui-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate without publishing
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@makersbrain'
          cache: npm

      - run: npm ci

      # The same gates CI runs. A tag can be pushed at any commit, including one
      # that never passed CI, so the release re-proves rather than assumes.
      - name: Generated assets match the generator
        run: |
          python3 build/build-logo.py --skip-wordmark --check --no-raster
          node scripts/build-odoo-scss.mjs --check
      - name: Types and components
        run: npm run check:types
      - name: Exports resolve inside the tarball
        run: node scripts/check-exports.mjs

      - name: Tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/ui-v')
        run: |
          set -eu
          manifest="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME#ui-v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $manifest" >&2
            exit 1
          fi
          echo "publishing $manifest"

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm pack --dry-run
